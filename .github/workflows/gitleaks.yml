name: gitleaks
on:
  push:
  pull_request:
  schedule: [{ cron: '17 4 * * 1' }]   # weekly re-audit of full history with a fresh binary
  workflow_dispatch:
permissions: { contents: read }
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }        # full history for the content scan + git log --all
      - run: sudo apt-get update && sudo apt-get install -y gitleaks
      - run: gitleaks detect --source . --config .gitleaks.toml --redact -v          # file content
      - run: |                                                                        # commit MESSAGES
          git log --all --format=%B > "$RUNNER_TEMP/m.txt"
          gitleaks detect --no-git --source "$RUNNER_TEMP/m.txt" --config .gitleaks.toml --redact -v
