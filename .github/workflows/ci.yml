name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      # The offline suite needs no VT key and no network by design (SPEC §12);
      # live smoke tests are env-gated and never run here.
      - run: uv run pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t vt-proxy:ci .
      - name: Smoke-test the container (dummy key — health and pre-validation need no VT)
        run: |
          docker run -d --name vt-proxy -p 127.0.0.1:11000:8000 \
            -e VT_API_KEY=ci-dummy-key vt-proxy:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:11000/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:11000/v1/health | grep -q '"status":"ok"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:11000/v1/score \
            -H 'Content-Type: application/json' -d '{"artifact": "garbage input"}')
          test "$code" = "422"
          docker rm -f vt-proxy
