name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      # The offline suite needs no VT key and no network by design (SPEC §12);
      # live smoke tests are env-gated and never run here.
      - run: uv run pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build with the classic builder (gate against BuildKit-only syntax)
        run: DOCKER_BUILDKIT=0 docker build -t vt-proxy:ci .
      # The release runs this only on a tag; here it runs on every push. The smoke tests
      # below then use the image the archive loaded back.
      - name: Archive round trip (save by tag, remove, load, compare Id)
        run: .github/scripts/archive-image.sh vt-proxy ci -  # no record: this image is never pushed
      # Both runs: a read-only root filesystem and no tmpfs, since the service writes nothing,
      # with or without CA_FILE. A dummy key: health and pre-validation need no VT.
      - name: Smoke-test read-only, without CA_FILE
        run: |
          docker run -d --name vt-proxy-smoke --read-only -p 127.0.0.1:11000:8000 \
            -e VT_API_KEY=ci-dummy-key vt-proxy:ci
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:11000/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          health=$(curl -fsS http://127.0.0.1:11000/v1/health) || { docker logs vt-proxy-smoke; exit 1; }
          echo "$health"
          grep -q '"status":"ok"' <<< "$health"
          grep -q '"extra_ca":false' <<< "$health"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:11000/v1/score \
            -H 'Content-Type: application/json' -d '{"artifact": "garbage input"}')
          test "$code" = "422"
          docker rm -f vt-proxy-smoke
      - name: Smoke-test read-only, with CA_FILE (a CA generated here)
        run: |
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 \
            -subj "/CN=vt-proxy CI test CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" \
            -keyout "$RUNNER_TEMP/ca.key" -out "$RUNNER_TEMP/ca.pem"
          chmod 644 "$RUNNER_TEMP/ca.pem"  # read by the service's uid 10001
          docker run -d --name vt-proxy-smoke-ca --read-only -p 127.0.0.1:11001:8000 \
            -e VT_API_KEY=ci-dummy-key -e CA_FILE=/etc/vt-proxy/ca.pem \
            -v "$RUNNER_TEMP/ca.pem:/etc/vt-proxy/ca.pem:ro" vt-proxy:ci
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:11001/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          health=$(curl -fsS http://127.0.0.1:11001/v1/health) || { docker logs vt-proxy-smoke-ca; exit 1; }
          echo "$health"
          grep -q '"extra_ca":true' <<< "$health"
          docker rm -f vt-proxy-smoke-ca
