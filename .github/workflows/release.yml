name: release
on:
  push:
    tags: ["v*"]

# The repo default for GITHUB_TOKEN is read-only; this explicit block
# elevates exactly one scope, for this workflow only.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match pyproject version
        run: |
          pkg=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$pkg" = "$GITHUB_REF_NAME" || {
            echo "::error::git tag $GITHUB_REF_NAME does not match pyproject version $pkg"; exit 1; }

      # Classic builder, same as the CI gate; OCI labels come from the
      # Dockerfile. Login only after the build, so the registry credential
      # exists for the push alone.
      - name: Build and push
        run: |
          version=${GITHUB_REF_NAME#v}
          image=ghcr.io/${{ github.repository }}
          DOCKER_BUILDKIT=0 docker build -t "$image:$version" -t "$image:latest" .
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$image:$version"
          docker push "$image:latest"
          echo "published $image:$version (+latest)"
